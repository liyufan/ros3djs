<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />

<script src="https://cdn.jsdelivr.net/npm/three@0.89.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/eventemitter3@5.0/dist/eventemitter3.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.js"></script>
<script src="../build/ros3d.js"></script>

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  #viewer {
    width: 100vw;
    height: 100vh;
  }
</style>

<script>
  const SERVER_HOST = window.location.hostname;
  const SERVER_PORT = 9000;
  const SERVER_URL = `ws://${SERVER_HOST}:${SERVER_PORT}`;
  const DEFAULT_FIXED_FRAME = '/livox_frame';
  const DEFAULT_TOPIC = '/livox/lidar';

  /**
   * Setup all visualization elements when the page is loaded.
   */
  function init() {
    // Clear the viewer div to ensure a fresh start.
    // This is important to avoid stacking multiple viewers on top of each other.
    var viewerDiv = document.getElementById('viewer');
    if (viewerDiv) {
      viewerDiv.innerHTML = '';
    }
    // Get the fixed frame and topic from the input fields or set defaults.
    var fixedFrame = document.getElementById('fixedFrame') ? document.getElementById('fixedFrame').value : DEFAULT_FIXED_FRAME;
    var topic = document.getElementById('topic') ? document.getElementById('topic').value : DEFAULT_TOPIC;
    // Connect to ROS.
    var ros = new ROSLIB.Ros({
      url : SERVER_URL
    });

    // Create the main viewer.
    var viewer = new ROS3D.Viewer({
      divID : 'viewer',
      width : viewerDiv.clientWidth,
      height : viewerDiv.clientHeight,
      antialias : true
    });

    // Setup a client to listen to TFs.
    var tfClient = new ROSLIB.TFClient({
      ros : ros,
      angularThres : 0.01,
      transThres : 0.01,
      rate : 10.0,
      fixedFrame : fixedFrame
    });

    var cloudClient = new ROS3D.PointCloud2({
        ros: ros,
        tfClient: tfClient,
        rootObject: viewer.scene,
        topic: topic,
        max_pts: 25000,
        colorsrc: 'intensity',
        intensityRange: [0, 75],
        material: { size: 0.05, color: 0xffffff }
    });
  }
</script>
</head>

<body onload="init()">
  <div id="viewer"></div>
</body>
</html>
